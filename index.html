<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禅語・格言デイリーウィズダムカウントダウン</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-stone-900 to-zinc-800 min-h-screen text-white">
<div class="max-w-xl mx-auto px-4 py-8">
  <!-- Header -->
  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-stone-100 mb-1">禅語・格言 デイリーウィズダム</h1>
    <p class="text-stone-400 text-sm">今日の格言 × カウントダウン × 瞑想タイマー</p>
  </div>

  <!-- Today's Proverb -->
  <div class="bg-stone-800 rounded-2xl shadow-lg p-6 mb-6 border border-stone-700">
    <div class="flex justify-between items-start mb-4">
      <span class="text-xs text-stone-400 uppercase tracking-widest">Today's Wisdom</span>
      <div class="flex gap-2">
        <button onclick="toggleFavorite()" id="fav-btn" aria-label="お気に入りに追加" class="text-2xl transition hover:scale-110">🤍</button>
        <button onclick="showNextProverb()" aria-label="別の格言を表示" class="text-xs text-stone-400 hover:text-stone-200 transition px-2 py-1 border border-stone-600 rounded-lg">別の格言</button>
      </div>
    </div>
    <div id="proverb-ja" class="text-xl font-bold text-stone-100 mb-3 leading-relaxed"></div>
    <div id="proverb-en" class="text-sm text-stone-400 italic mb-3 leading-relaxed"></div>
    <div id="proverb-source" class="text-xs text-stone-500"></div>
  </div>

  <!-- Countdown -->
  <div class="bg-stone-800 rounded-2xl shadow-lg p-6 mb-6 border border-stone-700 text-center">
    <p class="text-xs text-stone-400 uppercase tracking-widest mb-3">今日の終わりまで</p>
    <div class="flex justify-center gap-4 text-center" id="countdown">
      <div><div id="cd-h" class="text-4xl font-mono font-bold text-indigo-300">00</div><div class="text-xs text-stone-400 mt-1">時間</div></div>
      <div class="text-4xl font-bold text-stone-500 self-start mt-1">:</div>
      <div><div id="cd-m" class="text-4xl font-mono font-bold text-indigo-300">00</div><div class="text-xs text-stone-400 mt-1">分</div></div>
      <div class="text-4xl font-bold text-stone-500 self-start mt-1">:</div>
      <div><div id="cd-s" class="text-4xl font-mono font-bold text-indigo-300">00</div><div class="text-xs text-stone-400 mt-1">秒</div></div>
    </div>
    <p class="text-xs text-stone-500 mt-3">23:59:59 リセット</p>
  </div>

  <!-- Meditation Timer -->
  <div class="bg-stone-800 rounded-2xl shadow-lg p-6 mb-6 border border-stone-700">
    <h2 class="text-sm font-bold text-stone-300 mb-4 uppercase tracking-widest">瞑想タイマー</h2>
    <div class="flex gap-2 mb-4 flex-wrap">
      <button onclick="setMedTime(5)" aria-label="5分タイマー" data-min="5" class="med-btn px-4 py-2 rounded-xl text-sm font-semibold bg-stone-700 hover:bg-indigo-700 text-stone-300 hover:text-white transition border-2 border-transparent">5分</button>
      <button onclick="setMedTime(10)" aria-label="10分タイマー" data-min="10" class="med-btn px-4 py-2 rounded-xl text-sm font-semibold bg-stone-700 hover:bg-indigo-700 text-stone-300 hover:text-white transition border-2 border-transparent">10分</button>
      <button onclick="setMedTime(15)" aria-label="15分タイマー" data-min="15" class="med-btn px-4 py-2 rounded-xl text-sm font-semibold bg-stone-700 hover:bg-indigo-700 text-stone-300 hover:text-white transition border-2 border-transparent">15分</button>
      <button onclick="setMedTime(20)" aria-label="20分タイマー" data-min="20" class="med-btn px-4 py-2 rounded-xl text-sm font-semibold bg-stone-700 hover:bg-indigo-700 text-stone-300 hover:text-white transition border-2 border-transparent">20分</button>
    </div>
    <div class="text-center mb-4">
      <div id="med-display" class="text-5xl font-mono font-bold text-stone-100 mb-2">05:00</div>
      <div id="med-status" class="text-xs text-stone-400">タイマーを選択してください</div>
    </div>
    <!-- Progress ring -->
    <div class="flex justify-center mb-4">
      <svg width="120" height="120" viewBox="0 0 120 120" aria-label="瞑想タイマー進捗リング">
        <circle cx="60" cy="60" r="52" fill="none" stroke="#374151" stroke-width="8"/>
        <circle id="med-ring" cx="60" cy="60" r="52" fill="none" stroke="#6366F1" stroke-width="8"
          stroke-dasharray="326.7" stroke-dashoffset="326.7" stroke-linecap="round"
          transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1s linear;"/>
        <text x="60" y="65" text-anchor="middle" font-size="20" font-weight="bold" fill="white" id="med-ring-text">🧘</text>
      </svg>
    </div>
    <div class="flex gap-3">
      <button onclick="startMed()" id="btn-start" aria-label="瞑想タイマースタート" class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">▶ スタート</button>
      <button onclick="pauseMed()" id="btn-pause" aria-label="瞑想タイマー一時停止" class="flex-1 py-2 rounded-xl bg-stone-600 hover:bg-stone-500 text-white font-semibold transition">⏸ 停止</button>
      <button onclick="resetMed()" id="btn-reset" aria-label="瞑想タイマーリセット" class="flex-1 py-2 rounded-xl bg-stone-700 hover:bg-stone-600 text-stone-300 font-semibold transition">↺ リセット</button>
    </div>
  </div>

  <!-- Favorites -->
  <div class="bg-stone-800 rounded-2xl shadow-lg p-6 mb-6 border border-stone-700" id="fav-section">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-sm font-bold text-stone-300 uppercase tracking-widest">お気に入り <span id="fav-count" class="text-indigo-300">0</span>件</h2>
      <button onclick="toggleFavList()" aria-label="お気に入りリストを開閉" class="text-xs text-stone-400 hover:text-stone-200 transition" id="fav-toggle">▼ 開く</button>
    </div>
    <div id="fav-list" class="hidden space-y-3"></div>
  </div>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const PROVERBS = [
  {ja:'一期一会',en:'Treasure every encounter, for it will never recur.',src:'茶道の教え'},
  {ja:'禅の心、初心者の心',en:'In the beginner\'s mind there are many possibilities, but in the expert\'s there are few.',src:'鈴木俊隆'},
  {ja:'日日是好日',en:'Every day is a good day.',src:'雲門文偃禅師'},
  {ja:'無為自然',en:'Act in accordance with nature, without forcing.',src:'老子'},
  {ja:'即今只今',en:'Only this moment exists. Be here, now.',src:'禅語'},
  {ja:'七転び八起き',en:'Fall seven times, stand up eight.',src:'日本のことわざ'},
  {ja:'花は散るがゆえに美しい',en:'Flowers are beautiful precisely because they fall.',src:'禅の教え'},
  {ja:'知足者富',en:'Those who know enough are rich.',src:'老子 道徳経'},
  {ja:'今この瞬間が全てである',en:'The present moment is all there is.',src:'エックハルト・トール'},
  {ja:'水善利萬物而不爭',en:'The highest good is like water, benefiting all without striving.',src:'老子 道徳経'},
  {ja:'自灯明 法灯明',en:'Be a lamp unto yourself.',src:'釈迦（ブッダ）'},
  {ja:'吾唯足知',en:'I alone know that I have enough.',src:'龍安寺つくばい'},
  {ja:'雨奇晴好',en:'Both rain and sunshine bring their own beauty.',src:'蘇東坡'},
  {ja:'以和為貴',en:'Harmony is to be valued above all.',src:'聖徳太子 十七条憲法'},
  {ja:'明鏡止水',en:'A clear mirror reflects without distortion; still water shows all.',src:'荘子'},
  {ja:'苦しみは抵抗から生まれる',en:'Suffering arises from resistance to what is.',src:'禅の教え'},
  {ja:'莫妄想',en:'Do not entertain vain imaginings.',src:'禅語'},
  {ja:'行雲流水',en:'Go with the flow, like clouds and water.',src:'禅語'},
  {ja:'光陰矢の如し',en:'Time flies like an arrow.',src:'日本のことわざ'},
  {ja:'直心是道場',en:'A straightforward mind is the place of enlightenment.',src:'維摩経'},
  {ja:'空即是色',en:'Emptiness is form, form is emptiness.',src:'般若心経'},
  {ja:'人間万事塞翁が馬',en:'What seems a misfortune today may be a blessing tomorrow.',src:'准南子'},
  {ja:'不立文字',en:'Enlightenment cannot be transmitted through words alone.',src:'禅の教え'},
  {ja:'身心一如',en:'Body and mind are one.',src:'道元禅師'},
  {ja:'而今山水',en:'Mountains and rivers are as they are, right now.',src:'道元禅師 山水経'},
  {ja:'平常心是道',en:'Ordinary mind is the Way.',src:'南泉普願禅師'},
  {ja:'独坐大雄峰',en:'Sitting alone on the great peak.',src:'百丈懐海禅師'},
  {ja:'真に強い者は柔らかい',en:'True strength is gentle.',src:'老子'},
  {ja:'万法帰一',en:'All things return to the one.',src:'禅語'},
  {ja:'喜怒哀楽未発謂之中',en:'Before joy, anger, sorrow arise — that is the center.',src:'中庸'},
  {ja:'一木一草に仏を見る',en:'See the Buddha in every tree and blade of grass.',src:'禅の教え'},
  {ja:'心静かなる者は天下を制す',en:'One who is calm in heart masters the world.',src:'老子'},
  {ja:'聞いたことは忘れる。見たことは覚える。やったことは分かる',en:'I hear and I forget. I see and I remember. I do and I understand.',src:'孔子'},
  {ja:'鏡は前を映さず',en:'A mirror does not reflect the past or future.',src:'禅語'},
  {ja:'生死事大 無常迅速',en:'The matter of life and death is paramount; impermanence is swift.',src:'道元禅師'},
  {ja:'目覚めた者は一人でいても寂しくない',en:'The awakened mind is never alone.',src:'ブッダ'},
  {ja:'如人飲水 冷暖自知',en:'Like drinking water — only you know if it is warm or cold.',src:'禅語'},
  {ja:'春来草自生',en:'When spring comes, grass grows of its own accord.',src:'禅語'},
  {ja:'己に勝つことが最大の勝利',en:'Conquering oneself is the greatest victory.',src:'プラトン'},
  {ja:'一切唯心造',en:'All things are created by the mind.',src:'華厳経'},
  {ja:'動中静 静中動',en:'Find stillness in motion, and motion in stillness.',src:'禅語'},
  {ja:'この道を行けばどうなるものか 危ぶむなかれ',en:'Walk this path; do not fear what may come.',src:'一休宗純'},
  {ja:'有為転変は世の習い',en:'Change and transformation are the way of the world.',src:'平家物語'},
  {ja:'善因善果',en:'Good causes bring good results.',src:'仏教の教え'},
  {ja:'三人寄れば文殊の知恵',en:'Three minds together hold the wisdom of Manjushri.',src:'日本のことわざ'},
  {ja:'柔よく剛を制す',en:'Softness overcomes hardness.',src:'老子'},
  {ja:'足るを知る者は富む',en:'Those who know contentment are truly wealthy.',src:'老子'},
  {ja:'無心',en:'No-mind: act without selfish thought.',src:'禅語'},
  {ja:'刹那の中に永遠を見る',en:'See eternity in a moment.',src:'ウィリアム・ブレイク'},
  {ja:'迷わず行けよ 行けばわかるさ',en:'Go without hesitation — you will understand as you go.',src:'アントニオ猪木'},
  {ja:'今日の空はかつて見たことがない',en:'Today\'s sky has never been seen before.',src:'禅の教え'},
  {ja:'一花開天下春',en:'One flower blooming — spring comes to the whole world.',src:'禅語'},
  {ja:'坐禅は仏を学ぶことなり',en:'Zazen is the act of learning the Buddha.',src:'道元禅師'},
];

let todayIdx = 0;
let favorites = [];
let medTotal = 300;
let medRemaining = 300;
let medRunning = false;
let medTimer = null;
let audioCtx = null;
let favListOpen = false;

function getDateKey(){
  const d=new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function loadStorage(){
  const saved=JSON.parse(localStorage.getItem('zen-wisdom-2026')||'{}');
  if(saved.dateKey===getDateKey() && saved.idx!==undefined){
    todayIdx=saved.idx;
  } else {
    todayIdx=Math.floor(Math.random()*PROVERBS.length);
    saveStorage();
  }
  favorites=JSON.parse(localStorage.getItem('zen-favorites-2026')||'[]');
}

function saveStorage(){
  localStorage.setItem('zen-wisdom-2026', JSON.stringify({dateKey:getDateKey(), idx:todayIdx}));
}

function saveFavorites(){
  localStorage.setItem('zen-favorites-2026', JSON.stringify(favorites));
}

function displayProverb(){
  const p=PROVERBS[todayIdx];
  document.getElementById('proverb-ja').textContent=p.ja;
  document.getElementById('proverb-en').textContent=p.en;
  document.getElementById('proverb-source').textContent='— '+p.src;
  const isFav=favorites.includes(todayIdx);
  document.getElementById('fav-btn').textContent=isFav?'❤️':'🤍';
  document.getElementById('fav-btn').setAttribute('aria-label', isFav?'お気に入りから外す':'お気に入りに追加');
}

function showNextProverb(){
  todayIdx=(todayIdx+1)%PROVERBS.length;
  saveStorage();
  displayProverb();
}

function toggleFavorite(){
  const idx=favorites.indexOf(todayIdx);
  if(idx>=0){ favorites.splice(idx,1); }
  else { favorites.push(todayIdx); }
  saveFavorites();
  displayProverb();
  renderFavorites();
}

function toggleFavList(){
  favListOpen=!favListOpen;
  document.getElementById('fav-list').classList.toggle('hidden',!favListOpen);
  document.getElementById('fav-toggle').textContent=favListOpen?'▲ 閉じる':'▼ 開く';
}

function renderFavorites(){
  document.getElementById('fav-count').textContent=favorites.length;
  const list=document.getElementById('fav-list');
  list.innerHTML='';
  if(favorites.length===0){
    list.innerHTML='<p class="text-stone-500 text-xs text-center">お気に入りはまだありません</p>';
    return;
  }
  favorites.forEach(idx=>{
    const p=PROVERBS[idx];
    const div=document.createElement('div');
    div.className='bg-stone-700 rounded-xl p-3';
    div.innerHTML=`<div class="flex justify-between items-start gap-2">
      <div>
        <div class="text-sm font-semibold text-stone-100">${escHtml(p.ja)}</div>
        <div class="text-xs text-stone-400 italic mt-1">${escHtml(p.en)}</div>
        <div class="text-xs text-stone-500 mt-1">— ${escHtml(p.src)}</div>
      </div>
      <button onclick="removeFav(${idx})" aria-label="お気に入りから削除" class="text-xs text-stone-500 hover:text-red-400 transition shrink-0">✕</button>
    </div>`;
    list.appendChild(div);
  });
}

function removeFav(idx){
  favorites=favorites.filter(f=>f!==idx);
  saveFavorites();
  renderFavorites();
  displayProverb();
}

// Countdown
function updateCountdown(){
  const now=new Date();
  const end=new Date(now);
  end.setHours(23,59,59,0);
  const diff=Math.max(0,Math.floor((end-now)/1000));
  const h=Math.floor(diff/3600);
  const m=Math.floor((diff%3600)/60);
  const s=diff%60;
  document.getElementById('cd-h').textContent=String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent=String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent=String(s).padStart(2,'0');
}
setInterval(updateCountdown,1000);
updateCountdown();

// Meditation Timer
function setMedTime(min){
  if(medRunning) return;
  medTotal=min*60;
  medRemaining=medTotal;
  document.querySelectorAll('.med-btn').forEach(b=>{
    const isThis=parseInt(b.dataset.min)===min;
    b.classList.toggle('bg-indigo-700',isThis);
    b.classList.toggle('border-indigo-500',isThis);
    b.classList.toggle('text-white',isThis);
    b.classList.toggle('bg-stone-700',!isThis);
    b.classList.toggle('border-transparent',!isThis);
    b.classList.toggle('text-stone-300',!isThis);
  });
  updateMedDisplay();
  document.getElementById('med-status').textContent=min+'分の瞑想タイマーを選択中';
}

function updateMedDisplay(){
  const m=Math.floor(medRemaining/60), s=medRemaining%60;
  document.getElementById('med-display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const circumference=326.7;
  const pct=medTotal>0?medRemaining/medTotal:1;
  document.getElementById('med-ring').style.strokeDashoffset=circumference*(1-pct);
  document.getElementById('med-ring-text').textContent=medRunning?'🫁':'🧘';
}

function startMed(){
  if(medRunning || medRemaining<=0) return;
  medRunning=true;
  document.getElementById('med-status').textContent='瞑想中...';
  playBell(880, 0.5);
  medTimer=setInterval(()=>{
    if(medRemaining<=0){ clearInterval(medTimer); medRunning=false; document.getElementById('med-status').textContent='完了！お疲れ様でした 🙏'; playBell(528,2); updateMedDisplay(); return; }
    medRemaining--;
    updateMedDisplay();
  },1000);
}

function pauseMed(){
  if(!medRunning) return;
  clearInterval(medTimer);
  medRunning=false;
  document.getElementById('med-status').textContent='一時停止中';
  document.getElementById('med-ring-text').textContent='🧘';
}

function resetMed(){
  clearInterval(medTimer);
  medRunning=false;
  medRemaining=medTotal;
  document.getElementById('med-status').textContent='リセットしました';
  document.getElementById('med-ring-text').textContent='🧘';
  updateMedDisplay();
}

function getAudioCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playBell(freq, duration){
  try {
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.4,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+duration);
  } catch(e){}
}

loadStorage();
displayProverb();
renderFavorites();
</script>
</body>
</html>
